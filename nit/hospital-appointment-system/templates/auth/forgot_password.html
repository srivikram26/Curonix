{% extends "base.html" %}
{% block title %}Forgot Password - AI Hospital Scheduler{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <img src="/static/images/site-logo.png" alt="Curonix Logo" class="logo-image">
            <h1>Curonix</h1>
            <p>Reset your password</p>
        </div>
        
        <input type="hidden" id="user_role" value="{{ role }}">
        
        <div id="alert-container"></div>
        
        <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" 
                       placeholder="Enter your registered email" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="new_password" class="form-input" 
                           placeholder="Enter new password (min 6 characters)" required minlength="6">
                    <button type="button" class="toggle-password" data-toggle-password data-target="new_password">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirm_password" class="form-input" 
                           placeholder="Confirm new password" required minlength="6">
                    <button type="button" class="toggle-password" data-toggle-password data-target="confirm_password">👁️</button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-full btn-lg" id="resetBtn">
                Reset Password
            </button>
        </form>
        
        <div class="auth-footer">
            <a href="{{ url_for('auth.login_page', role=role) }}">← Back to Login</a>
            <br><br>
            Don't have an account? <a href="{{ url_for('auth.register_page', role=role) }}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.password-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}
.password-input-wrapper .form-input {
    padding-right: 45px;
}
.toggle-password {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    opacity: 0.6;
}
.toggle-password:hover {
    opacity: 1;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
async function handleForgotPassword(event) {
    event.preventDefault();
    
    const btn = document.getElementById('resetBtn');
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    // Validate passwords match
    if (newPassword !== confirmPassword) {
        document.getElementById('alert-container').innerHTML = 
            '<div class="alert alert-danger">Passwords do not match</div>';
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Resetting...';
    
    const data = {
        email: document.getElementById('email').value,
        new_password: newPassword
    };
    
    try {
        const result = await API.post('{{ url_for('auth.forgot_password') }}', data);
        
        if (result.success) {
            document.getElementById('alert-container').innerHTML = 
                '<div class="alert alert-success">' + result.message + '</div>';
            
            setTimeout(() => {
                const loginUrl = new URL('{{ url_for('auth.login_page') }}', window.location.origin);
                loginUrl.searchParams.set('role', (result.role || '{{ role }}'));
                window.location.href = loginUrl.toString();
            }, 1500);
        }
    } catch (error) {
        document.getElementById('alert-container').innerHTML = 
            '<div class="alert alert-danger">' + error.message + '</div>';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
}
</script>
{% endblock %}
